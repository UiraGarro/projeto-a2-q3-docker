   services:
     mysql_app:
       image: mysql:8.4
       container_name: app_mysql
       restart: always
       ports:
         - "3307:3306"
       environment:
         MYSQL_DATABASE: appdb
         MYSQL_USER: appuser
         MYSQL_PASSWORD: appsenha123
         MYSQL_ROOT_PASSWORD: rootsenha123
       volumes:
         - app_db_data:/var/lib/mysql
       networks:
         - app_network

   networks:
     app_network:
       driver: bridge

   volumes:
     app_db_data: